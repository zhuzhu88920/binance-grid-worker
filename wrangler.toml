name = "binance-grid-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cron 触发器 - 每 5 分钟执行
[triggers]
crons = ["*/5 * * * *"]

# KV 命名空间（只用于持久化 last_matched_counts）
[[kv_namespaces]]
binding = "GRID_KV"
id = "3ec5780ee6234d97863cba22a28beed3"

# ============================================================
# 凭证配置方式：
#   本地开发  → 写入 .dev.vars（不提交 git）
#   CF 生产   → wrangler secret put USER1_COOKIE
#               wrangler secret put USER1_CSRF_TOKEN
#               wrangler secret put USER1_BARK_KEY
#               wrangler secret put USER1_ID
#   多用户追加 USER2_COOKIE / USER2_CSRF_TOKEN ...
# ============================================================
