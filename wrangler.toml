name = "binance-grid-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cron 触发器 - 每 5 分钟执行
[triggers]
crons = ["*/5 * * * *"]

# KV 命名空间绑定
# 先运行: npx wrangler kv:namespace create GRID_KV
# 将返回的 id 填入下方
[[kv_namespaces]]
binding = "GRID_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# 环境变量（非敏感，可直接写在配置里）
[vars]
ENVIRONMENT = "production"

# secrets（使用 wrangler secret put 命令设置，不要写在这里）
# wrangler secret put UPDATE_SECRET
# wrangler secret put BARK_KEY_DEFAULT
